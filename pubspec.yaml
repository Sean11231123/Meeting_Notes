name: meeting_notes
description: "A local-first AI Meeting Assistant for students."
publish_to: 'none'
version: 1.4.0+3

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- 核心功能套件 ---
  record: ^6.1.2
  path_provider: ^2.1.0
  permission_handler: ^12.0.1
  google_generative_ai: ^0.4.6
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  flutter_markdown_plus: ^1.0.0
  http: ^1.2.0
  share_plus: ^10.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  table_calendar: ^3.1.2
  intl: ^0.19.0
  provider: ^6.1.2
  web: ^1.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
